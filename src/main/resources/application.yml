spring:
  config:
    import: classpath:application-secret.yml
#  profile:
#    include: secret #jwt secret key
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    web:
      pageable:
        one-indexed-parameters: true # @PageableDefault Pageable 에 대해서 작동
        default-page-size: 5
  datasource:
    url: jdbc:h2:mem:hodolog;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true #(2.5~) Hibername ??? ?? data.sql ??
  sql:
  session:
    timeout: 86400 #세션유효기간
    init:
      mode: always # data.sql 실행용 -> 가입기능 만들면서 삭제

#hodolman:
#  jwt-kwy: "rTPmA9Sgk+Q1Xwu]bG7E6xFFUhQpdi+a151yPnRTK/Q="

server:
  servlet:
    session:
      cookie:
        max-age: 172800 # 세션유효기간